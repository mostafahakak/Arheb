# Render Blueprint: https://render.com/docs/blueprint-spec
# Use `runtime` (not `env`) for Node. Node version follows package.json "engines" / .nvmrc.
services:
  - type: web
    name: arheb-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # Set JOFOTARA_PAUSED=false (or remove) when JoFotara should run again.
    envVars:
      - key: JOFOTARA_PAUSED
        value: "true"